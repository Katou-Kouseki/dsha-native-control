# DSHA Native Control bundle patch: inserts this plugin's row into the web
# profile roster. Applied as a profile bundle layer over dsh-base; the row is
# a bare plugin by package name — the node half (exports ".") runs in the
# host process (backend manager, native/adb engines, /api/dsha-native-control
# routes, WebSocket stream, agent tools), and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/dsha-native-control/client.js) load in the web GUI.
- insert:
    - id: dsha-native-control
      name: '@katou-kouseki/dsha-native-control'
